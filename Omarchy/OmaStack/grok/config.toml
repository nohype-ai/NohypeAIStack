[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
permission_mode = "always-approve"
theme = "auto"

[sandbox]
profile = "strict"

[permission]
deny = [
  "Read(**/.ssh/**)",
  "Read(**/.gnupg/**)",
  "Read(**/.env)",
  "Read(**/.env.*)",
  "Read(**/*.pem)",
  "Read(**/*.key)",
  "Edit(**/.ssh/**)",
  "Edit(**/.gnupg/**)",
  "Edit(**/.env)",
  "Edit(**/.env.*)",
  "Edit(**/*.pem)",
  "Edit(**/*.key)",
]
